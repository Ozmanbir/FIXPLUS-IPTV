name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -q FIXPLUS-IPTV-APK-PROJE-GITHUB-HAZIR.zip -d project

      - name: Show project files
        run: |
          echo "Proje dosyaları:"
          find project -maxdepth 3 -type f | sort

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIXPLUS-IPTV-APK
          path: project/app/build/outputs/apk/**/*.apk
