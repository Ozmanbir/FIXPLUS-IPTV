name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "HATA: gradlew bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Gradle projesi bulundu: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIXPLUS-IPTV-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
