name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -q FIXPLUS-IPTV-APK-PROJE-GITHUB.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadı!"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Gradle bulundu: $GRADLEW"
          echo "GRADLE_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x "$GRADLE_DIR/gradlew"
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIXPLUS-IPTV-APK
          path: project/**/build/outputs/apk/**/*.apk
